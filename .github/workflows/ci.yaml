name: CI Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Project Dependencies
        run: uv sync --all-extras

      - name: Run Pytest
        run: uv run --with pytest --with pytest-mock pytest