name: Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  run-tests:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/git-version-sync

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-binaries:
    needs: run-tests

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: git-version-sync

          - os: windows-latest
            platform: win-x64
            executable: git-version-sync.exe

          - os: macos-latest
            platform: macos-arm64
            executable: git-version-sync

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build binary
        run: uv run pyinstaller --name git-version-sync --onefile --paths src pyinstaller_entry.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: git-version-sync-${{ matrix.platform }}
          path: dist/${{ matrix.executable }}

  publish-npm:
    needs:
      - build
      - build-binaries

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: git-version-sync-linux-x64
          path: bin/linux-x64/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: git-version-sync-win-x64
          path: bin/win-x64/

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: git-version-sync-macos-arm64
          path: bin/macos-arm64/

      - name: Make Unix binaries executable
        run: |
          chmod +x bin/linux-x64/git-version-sync
          chmod +x bin/macos-arm64/git-version-sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}